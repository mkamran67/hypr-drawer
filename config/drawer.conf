# hypr-drawer — sourced from hyprland.conf
# Toggle the pop-up "drawer desktop". Default: SUPER+CTRL+R.
#
# Absolute paths are used below because Hyprland is often started with a
# minimal PATH that does NOT include ~/.local/bin, which would silently
# break `exec, hypr-drawer …`.

# Daemon: keeps the launcher widget warm and listens for `toggle` IPC.
exec-once = $HOME/.local/bin/hypr-drawer daemon

# Keybind — managed by the in-app settings, written to drawer-bind.conf by
# the daemon. The default file (created on first run) binds SUPER+CTRL+R;
# change it from the drawer's settings page, not by editing the file.
source = $HOME/.config/hypr/drawer-bind.conf

# All windows in any per-monitor drawer special float + are resizable.
# Per-monitor specials are named `special:drawer-<connector>` (e.g.
# `special:drawer-DP-1`), so we match by regex on the workspace name.
# Hyprland 0.53+ syntax: `match:` filter + `<rule> on` action.
windowrule = float on, match:workspace r:^special:drawer-

# Blur the special workspace background so the drawer feels like an overlay.
decoration {
    blur {
        enabled = true
        special = true
        size = 8
        passes = 3
        new_optimizations = true
        xray = false
    }
}

# Blur the launcher rail itself (layer-shell namespace = "hypr-drawer").
layerrule = blur on, match:namespace hypr-drawer

# Blur the per-monitor shade overlays used by "blur all monitors" mode.
# The shade windows are nearly transparent — the blur is what gives them
# their visual effect.
layerrule = blur on, match:namespace hypr-drawer-shade
