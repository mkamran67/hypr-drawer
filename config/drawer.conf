# hypr-drawer — sourced from hyprland.conf
# Toggle the pop-up "drawer desktop" with $mod+Home (rebind below if you prefer).

# Daemon: keeps the launcher widget warm and listens for `toggle` IPC.
exec-once = hypr-drawer daemon

# Keybind — change "HOME" to whatever you like.
bind = SUPER, HOME, exec, hypr-drawer toggle

# All windows in the drawer's special workspace float + are resizable.
# Hyprland 0.53+ syntax: `match:` filter + `<rule> on` action, comma-separated.
windowrule = float on, match:workspace special:drawer

# Blur the special workspace background so the drawer feels like an overlay.
decoration {
    blur {
        enabled = true
        special = true
        size = 8
        passes = 3
        new_optimizations = true
        xray = false
    }
}

# Blur the launcher rail itself (layer-shell namespace = "hypr-drawer").
layerrule = blur on, match:namespace hypr-drawer
